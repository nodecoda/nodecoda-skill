name: release

on:
  # Releases are tag-driven only: push a v*.*.* tag matching
  # skills/nodecoda-workflow/manifest.json (git tag vX.Y.Z && git push origin
  # vX.Y.Z). Manual workflow_dispatch must select that same v* tag in the UI;
  # running it on `main` fails the verify guard below by design.
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # for npm trusted publishing

jobs:
  verify:
    name: Verify version + manifest
    runs-on: ubuntu-latest
    outputs:
      skill-version: ${{ steps.v.outputs.skill-version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          REF_TYPE="${GITHUB_REF_TYPE}"
          SKILL_VER=$(node -p "require('./skills/nodecoda-workflow/manifest.json').version")
          echo "skill-version=$SKILL_VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Release must be triggered by a v* version tag, not ref '$TAG' (ref_type=$REF_TYPE). Push a matching tag: git tag v$SKILL_VER && git push origin v$SKILL_VER"
            exit 1
          fi
          if [[ "$TAG" != "v$SKILL_VER" ]]; then
            echo "::error::Tag $TAG does not match manifest version $SKILL_VER. Bump manifest.json/package.json first, then tag v$SKILL_VER."
            exit 1
          fi

  publish-npm:
    name: Publish @nodecoda/skill to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    env:
      # job-level so actions/setup-node writes it into ~/.npmrc (step-level
      # NODE_AUTH_TOKEN was invisible to setup-node -> ENEEDAUTH on publish)
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Publish
        run: |
          VER="${{ needs.verify.outputs.skill-version }}"
          if npm view "@nodecoda/skill@$VER" version >/dev/null 2>&1; then
            echo "version $VER already published — skipping publish (idempotent release)"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke-npx:
    name: Smoke npx install from the published package
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - name: npx add + version parity + MCP auto-registration
        run: |
          VER="${{ needs.verify.outputs.skill-version }}"
          # npm CDN propagation can lag the publish by up to a minute or two;
          # probe the registry directly (uncached) before installing.
          for i in $(seq 1 18); do
            if npm view "@nodecoda/skill@$VER" version >/dev/null 2>&1; then break; fi
            sleep 10
          done
          npm view "@nodecoda/skill@$VER" version
          # Explicit dir = exact location (named targets install user-wide).
          npx -y "@nodecoda/skill@$VER" add nodecoda-workflow ./.codex/skills
          test -f .codex/skills/nodecoda-workflow/SKILL.md
          node -e "const m=require('./.codex/skills/nodecoda-workflow/manifest.json'); if (m.version !== process.argv[1]) { console.error('manifest version mismatch', m.version); process.exit(1); }" "$VER"
          # The seamless part: the MCP server must be auto-registered for Codex.
          test -f .codex/config.toml
          grep -q '\[mcp_servers.nodecoda\]' .codex/config.toml

  github-release:
    name: GitHub Release with npm tarball
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pack npm tarball
        run: npm pack
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.tgz"
